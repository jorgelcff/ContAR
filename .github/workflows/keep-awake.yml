# Keeps the Render services awake — but only between dates you choose.
#
# Why: on Render's free plan a service sleeps after 15 minutes without
# traffic, and the next visitor waits for it to boot. Measured on 2026-09-27
# from a cold start: the frontend answered in 12.6 s and the API in 21.9 s.
# At a poster, that is the first person to scan the QR code staring at a
# blank page for half a minute.
#
# Why only between dates: the free plan has 750 instance-hours a month for the
# whole workspace. Two services kept awake around the clock come to ~1,440 —
# double the allowance. A few event days (2 services x 24 h x 4 days = 192 h)
# fit easily.
#
# How to switch it on: GitHub → Settings → Secrets and variables → Actions →
# Variables, and add
#   KEEP_AWAKE_FROM   first day, e.g. 2026-10-20   (optional)
#   KEEP_AWAKE_UNTIL  last day,  e.g. 2026-10-23   (required — without it
#                                                   this workflow does nothing)
#   KEEP_AWAKE_URLS   space-separated URLs to ping (optional; defaults below)
#   KEEP_AWAKE_TZ     timezone for the dates (optional; default America/Sao_Paulo)
# Delete KEEP_AWAKE_UNTIL, or let the date pass, and it stops by itself.
#
# GitHub may delay scheduled runs under load, so a ping can occasionally land
# after the 15-minute mark. For a guarantee, an external pinger such as
# cron-job.org hitting the same URLs every 5 minutes is more reliable.

name: Keep Render awake (event days only)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the services inside the configured window
        env:
          FROM: ${{ vars.KEEP_AWAKE_FROM }}
          UNTIL: ${{ vars.KEEP_AWAKE_UNTIL }}
          URLS: ${{ vars.KEEP_AWAKE_URLS || 'https://avaturn-threejs-1.onrender.com/ https://avaturn-threejs.onrender.com/api/health' }}
          ZONE: ${{ vars.KEEP_AWAKE_TZ || 'America/Sao_Paulo' }}
        run: |
          today=$(TZ="$ZONE" date +%F)
          if [ -z "$UNTIL" ]; then
            echo "KEEP_AWAKE_UNTIL is not set — nothing to do."
            exit 0
          fi
          if [ -n "$FROM" ] && [[ "$today" < "$FROM" ]]; then
            echo "Today ($today) is before $FROM — nothing to do."
            exit 0
          fi
          if [[ "$today" > "$UNTIL" ]]; then
            echo "The window ended on $UNTIL — nothing to do."
            exit 0
          fi
          for url in $URLS; do
            # A sleeping service takes up to a minute to answer; that is the
            # point, so wait for it rather than timing out.
            code=$(curl -s -o /dev/null -m 90 -w '%{http_code}' "$url" || true)
            echo "$url -> ${code:-no answer}"
          done
