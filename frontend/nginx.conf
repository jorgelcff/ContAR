server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow large avatar/audio uploads (multer limit is 50MB for models)
  client_max_body_size 50M;

  location /api/ {
    proxy_pass ${API_ORIGIN}/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
  }

  # Proxy uploaded files (GLB, VRM, audio) to the backend.
  # The backend serves /uploads/ via express.static, but the URL
  # uses the frontend domain, so nginx must forward these requests.
  # ^~ so the static-file regex below never claims an uploaded .glb: it would
  # look for it on this disk and answer 404 instead of proxying it.
  location ^~ /uploads/ {
    proxy_pass ${API_ORIGIN}/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    # Cache uploaded assets aggressively — filenames are unique timestamps
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Vite puts a content hash in every file name under /assets/, so a new build
  # always means a new URL: these can be kept for good.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Models, animations and the environment map carry no hash, so keep them a
  # week rather than forever. They were sent with no caching header at all,
  # which left each browser to guess: measured, a 9.4 MB animation was fetched
  # again on every page load, including the jump from the story to AR.
  location ~* \.(glb|gltf|hdr)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }
  location = /animations/manifest.json {
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri $uri/ /index.html;
    # The page itself must always be checked, or a visitor keeps an old build
    # pointing at hashed assets that no longer exist.
    add_header Cache-Control "no-cache";
  }
}
